# Publishes an API check on the PR head from the reviewed default branch only (#585).
# Never checks out PR code, downloads artifacts, installs dependencies, comments, merges or deploys.
# Activate as a native required check only after reviewed promotion to main and a real API smoke test.
name: Merge policy gate

on:
  workflow_run:
    workflows: [CI, CodeQL]
    types: [completed]
  check_run:
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  gate:
    name: Publish strict merge evidence
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'check_run' &&
       github.event.check_run.app.slug == 'cloudflare-workers-and-pages') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cueory-merge-policy
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Evaluate and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/automerge/native-gate.ts --publish
